        body: |
          // pick out name and uniqueID
          fn(state => {

            const cleanUsers = state.data.map(u => ({
              name: u.name,
              uniqueId: u.phone.replace(/-/g, "").replace(/\s/g, '')
            }));

            const someCalc = state.data[1].id * 15
            console.log('the result', someCalc);

            return { cleanUsers };
          })
            .then(state => {
              console.log(state);
              return state;
            })
