        credential: null
        body: |
          // map and load TEIs
          each(
            $.cleanUsers,
            create("trackedEntityInstances", {
              orgUnit: "FV43JisquSm" /*0001 CH Mahosot*/,
              trackedEntityType: "MCPQUTHX1Ze" /*Person*/,
