  Nightly-MS-SQL-to-DHIS2-ETL-Pipeline:
    name: Nightly MS SQL to DHIS2 ETL Pipeline
    jobs:
      Fetch-data-from-MS-SQL:
        name: Fetch data from MS SQL
        adaptor: '@openfn/language-mssql@latest'
        credential: null
        body: |
          // Add operations here

          sql(`
            SELECT TABLE_NAME 
            FROM INFORMATION_SCHEMA.TABLES 
            WHERE TABLE_TYPE = 'BASE TABLE'
          `);


          fn(state => {
            const tables = state.data;
            return { ...state, tables, allRecords: {} };
          });

          each(
            dataPath('tables[*]'),
            sql(state => `SELECT * FROM ${state.data.TABLE_NAME}`, {}, (state, refs) => {
              const tableName = state.data.TABLE_NAME;
              return {
                ...state,
                allRecords: {
                  ...state.allRecords,
                  [tableName]: refs
                }
              };
            })
          );

      Transform-data:
        name: Transform data
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
