name: frank-demo
description: null
collections: null
channels:
  jsonplaceholder:
    name: jsonplaceholder
    destination_url: 'https://jsonplaceholder.typicode.com'
    enabled: true
    destination_credential: null
  openfn-staging:
    name: openfn staging
    destination_url: 'https://app.staging.openfn.org'
    enabled: true
    destination_credential: frank@openfn.org-Basic
credentials:
  frank@openfn.org-Basic:
    name: Basic
    owner: frank@openfn.org
  frank@openfn.org-DHIS2-play:
    name: DHIS2 play
    owner: frank@openfn.org
  frank@openfn.org-test-credential-from-canvas:
    name: test credential from canvas
    owner: frank@openfn.org
workflows:
  Event-based-workflow:
    name: Event-based workflow
    jobs:
      Transform-data:
        name: Transform data
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          // Validate and transform the data you've received...
          fn(state => {
            console.log("Do some data transformation here");
            state.webhookResponse = {status: 200, body: state.data};
            return state;
          })

    triggers:
      webhook:
        type: webhook
        webhook_reply: after_completion
        enabled: true
    edges:
      webhook->Transform-data:
        source_trigger: webhook
        target_job: Transform-data
        condition_type: always
        enabled: true
  Sample-Workflow:
    name: Sample Workflow
    jobs:
      Job-1---Check-if-age-is-over-18-months:
        name: Job 1 - Check if age is over 18 months
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          fn(state => {
            console.log(state);
            
            if (state.data.age_in_months > 18) {
              console.log('Eligible for program.');
              return state;
            }
            else { throw 'Error, patient ineligible.' }
          });

      Job-2---Convert-data-to-DHIS2-format:
        name: Job 2 - Convert data to DHIS2 format
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          fn(state => {
            const names = state.data.name.split(' ');
            return { ...state, names };
          });

      Job-3---Upload-to-DHIS2:
        name: Job 3 - Upload to DHIS2
        adaptor: '@openfn/language-dhis2@latest'
        credential: frank@openfn.org-DHIS2-play
        body: |
          create('trackedEntityInstances', {
            trackedEntityType: 'nEenWmSyUEp', // a person
            orgUnit: 'DiszpKrYNg8',
            attributes: [
              {
                attribute: 'w75KJ2mc4zz', // attribute id for first name
                value: state.names[0] // the first name from submission
              },
              {
                attribute: 'zDhUuAYrxNC', // attribute id for last name
                value: state.names[1] // the last name from submission
              }
            ]
          });

    triggers:
      webhook:
        type: webhook
        webhook_reply: after_completion
        enabled: true
    edges:
      webhook->Job-1---Check-if-age-is-over-18-months:
        source_trigger: webhook
        target_job: Job-1---Check-if-age-is-over-18-months
        condition_type: always
        enabled: true
      Job-1---Check-if-age-is-over-18-months->Job-2---Convert-data-to-DHIS2-format:
        source_job: Job-1---Check-if-age-is-over-18-months
        target_job: Job-2---Convert-data-to-DHIS2-format
        condition_type: on_job_success
        enabled: true
      Job-2---Convert-data-to-DHIS2-format->Job-3---Upload-to-DHIS2:
        source_job: Job-2---Convert-data-to-DHIS2-format
        target_job: Job-3---Upload-to-DHIS2
        condition_type: on_job_success
        enabled: true
